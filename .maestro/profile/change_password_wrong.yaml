# test_plan: settings.change_password.wrong_current
# Never changes the password: the current password typed is wrong on purpose.
appId: ${APP_ID || "app.statelesslabs.mintelspace"}
tags: [profile]
---
- launchApp
- runFlow: ../subflows/login.yaml
- tapOn: "(?s)Profile.*"
- tapOn: "Settings"
- tapOn: "(?s)Account.*"
- tapOn: "(?s)Change password.*"
- tapOn:
    id: "current-password"
- inputText: "definitely-not-my-password"
- hideKeyboard
- tapOn:
    id: "new-password"
- inputText: "new-password-123"
- hideKeyboard
- tapOn:
    id: "confirm-password"
- inputText: "new-password-123"
- hideKeyboard
- tapOn: "Update password"
- extendedWaitUntil:
    visible: "(?s).*That password is not right.*"
    timeout: 15000
