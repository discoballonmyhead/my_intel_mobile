# test_plan: auth.recovery.forgot, auth.sign_in.error_cleared
appId: ${APP_ID || "app.statelesslabs.mintelspace"}
tags: [auth]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "SIGN IN"
    timeout: 15000
# Trigger the sign-in error first, so we can check it does not follow us.
- tapOn: "Email"
- inputText: "maestro.wrong@example.com"
- tapOn: "Password"
- inputText: "not-the-password-123"
- hideKeyboard
- tapOn: "SIGN IN"
- extendedWaitUntil:
    visible: "That email and password do not match an account."
    timeout: 15000
- tapOn: "Forgot password?"
- assertVisible: "Forgot your password?"
- assertVisible: "SEND RESET LINK"
- assertNotVisible: "That email and password do not match an account."
- tapOn: "Back to sign in"
- assertVisible: "SIGN IN"
