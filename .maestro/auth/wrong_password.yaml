# test_plan: auth.sign_in.wrong_password
appId: ${APP_ID || "app.statelesslabs.mintelspace"}
tags: [auth]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "SIGN IN"
    timeout: 15000
- tapOn: "Email"
- inputText: "maestro.wrong@example.com"
- tapOn: "Password"
- inputText: "not-the-password-123"
- hideKeyboard
- tapOn: "SIGN IN"
- extendedWaitUntil:
    visible: "That email and password do not match an account."
    timeout: 15000
