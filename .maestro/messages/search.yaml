# test_plan: messages.search
appId: ${APP_ID || "app.statelesslabs.mintelspace"}
tags: [messages]
---
- launchApp
- runFlow: ../subflows/login.yaml
- tapOn: "(?s)Messages.*Tab.*"
- tapOn: "Search messages and people"
- inputText: "zzqxv"
- assertVisible: "(?s).*No results for.*zzqxv.*"
- tapOn: "Cancel"
- assertVisible: "(?s)Groups.*"
